name: Promising Signals CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate signal schema
        run: python3 scripts/validate.py
      - name: Validate public trust surfaces
        run: python3 scripts/validate_public_trust_surfaces.py
      - name: Verify generated files are committed
        run: git diff --exit-code -- data/signals.jsonl schemas/promising-signal.schema.json signals/index.md signals/*.md
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
