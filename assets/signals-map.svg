<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Promising signals map</title><desc id="desc">Public-safe diagram showing promising signals as a separate non-paper preservation lane.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#c084fc"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.title{font:800 34px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#edf3ff}.small{font:600 17px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#b8c3d9}.tiny{font:600 13px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#93a4c2}.box{fill:rgba(15,23,42,.82);stroke:#334155;stroke-width:1.5}.accent{stroke:url(#a);stroke-width:4;fill:none;marker-end:url(#arrow)}.pill{fill:#0f172a;stroke:#475569}.num{font:900 28px ui-sans-serif,system-ui,Segoe UI,sans-serif;fill:#7dd3fc}.muted{fill:#93a4c2;font:500 14px ui-sans-serif,system-ui,Segoe UI,sans-serif}</style><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b5cf6"/></marker></defs><rect width="1100" height="360" rx="26" fill="url(#bg)"/><text x="52" y="62" class="title">Promising signals are preserved leads, not papers</text><g transform="translate(70 130)"><rect class="box" width="210" height="120" rx="18"/><text class="small" x="20" y="42">No-paper result</text><text class="tiny" x="20" y="74">bounded local evidence</text><text class="tiny" x="20" y="96">explicit stop reason</text></g><path class="accent" d="M295 190 H375"/><g transform="translate(390 105)"><rect class="box" width="240" height="170" rx="18"/><text class="small" x="20" y="42">Deterministic curation</text><text class="tiny" x="20" y="74">status + evidence strength</text><text class="tiny" x="20" y="96">follow-up depth</text><text class="tiny" x="20" y="118">source lineage</text><text class="num" x="20" y="152">6,381</text></g><path class="accent" d="M645 190 H725"/><g transform="translate(740 130)"><rect class="box" width="270" height="120" rx="18"/><text class="small" x="20" y="42">Future test queue</text><text class="tiny" x="20" y="74">larger compute</text><text class="tiny" x="20" y="96">independent validation</text></g></svg>
